<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Guide Skeleton</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f7f9;
      --border: #e1e6ea;
      --bone: #e4e8ec;
      --bone-hi: #f1f4f6;
      --text: #1f2a33;
      --muted: #62707c;
      --accent: #2b4a6f;
      --radius: 6px;
      --max: 1180px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161a;
        --surface: #1a2026;
        --border: #2a323a;
        --bone: #262e36;
        --bone-hi: #313a43;
        --text: #e6ebef;
        --muted: #97a3ad;
        --accent: #7fa6d1;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }

    /* Skeleton "bone" placeholder with shimmer */
    .bone {
      display: block;
      background: linear-gradient(90deg, var(--bone) 25%, var(--bone-hi) 37%, var(--bone) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: var(--radius);
      height: 14px;
    }
    .bone.circle { border-radius: 50%; }
    .bone.pill { border-radius: 999px; }
    @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    @media (prefers-reduced-motion: reduce) { .bone { animation: none; } }

    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    .skip-link { position: absolute; left: -999px; }
    .skip-link:focus { left: 16px; top: 8px; background: var(--bg); padding: 8px; z-index: 10; }

    /* 1. Top bar */
    .topbar { border-bottom: 1px solid var(--border); }
    .topbar .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
    .route { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }

    /* 2. Notice banner */
    .notice { background: var(--surface); border-bottom: 1px solid var(--border); }
    .notice .wrap { display: flex; align-items: center; gap: 16px; padding-top: 12px; padding-bottom: 12px; }
    .notice .lines { flex: 1; display: grid; gap: 8px; }

    /* 3. Main nav */
    .mainnav { border-bottom: 1px solid var(--border); }
    .mainnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 28px; overflow-x: auto; }
    .mainnav li { padding: 18px 0; flex: none; }
    .mainnav li.active { box-shadow: inset 0 -3px 0 var(--accent); }

    /* 4. Breadcrumb + heading */
    .crumbs { display: flex; align-items: center; gap: 10px; padding: 20px 0 8px; }
    .page-head { padding: 8px 0 24px; display: grid; gap: 14px; }

    /* 5. Tabs */
    .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    .tabs span { padding: 12px 0; }
    .tabs .active { box-shadow: inset 0 -3px 0 var(--accent); }

    /* 6. Step-by-step accordion */
    .section-head { display: grid; gap: 10px; margin-bottom: 20px; }
    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .step { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
    .step > button {
      all: unset; box-sizing: border-box; cursor: pointer;
      display: flex; align-items: center; gap: 16px; width: 100%; padding: 18px;
    }
    .step > button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius); }
    .step-num {
      flex: none; width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 600;
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    }
    .step-titles { flex: 1; display: grid; gap: 8px; min-width: 0; }
    .chev { flex: none; color: var(--muted); transition: transform .2s; }
    .step[open-state="true"] .chev { transform: rotate(180deg); }
    .step-body { display: none; padding: 0 18px 20px 70px; gap: 10px; }
    .step[open-state="true"] .step-body { display: grid; }

    /* 7. CTA cards */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 48px 0; }
    .card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 24px;
      display: grid; gap: 12px; background: var(--surface);
    }
    .card .bone.btn { height: 40px; width: 120px; margin-top: 8px; }

    /* 8. Footer */
    footer { border-top: 1px solid var(--border); background: var(--surface); padding: 32px 0; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 14px 28px; margin-bottom: 24px; }
    .footer-meta { display: grid; gap: 8px; }

    /* 9. Cookie banner */
    .cookie {
      position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 760px; margin: 0 auto;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 16px;
      display: flex; gap: 16px; align-items: center;
    }
    .cookie .lines { flex: 1; display: grid; gap: 8px; }
    .cookie .btns { display: flex; gap: 8px; flex: none; }
    .cookie[hidden] { display: none; }

    @media (max-width: 860px) {
      .cards { grid-template-columns: 1fr; }
      .hide-sm { display: none !important; }
      .step-body { padding-left: 18px; }
      .cookie { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- 1. Top bar: logo · origin → destination · search · language -->
  <div class="topbar">
    <div class="wrap">
      <span class="bone" style="width:110px;height:32px" aria-label="Logo placeholder"></span>
      <div class="route hide-sm">
        <span class="bone circle" style="width:22px;height:22px"></span>
        <span class="bone" style="width:140px"></span>
        <span aria-hidden="true" style="color:var(--muted)">&rarr;</span>
        <span class="bone circle" style="width:22px;height:22px"></span>
        <span class="bone" style="width:200px"></span>
      </div>
      <div class="topbar-actions" style="margin-left:auto">
        <span class="bone circle" style="width:28px;height:28px" aria-label="Search"></span>
        <span class="bone pill" style="width:96px;height:32px" aria-label="Language"></span>
        <span class="bone" style="width:28px;height:22px;display:none" aria-label="Menu"></span>
      </div>
    </div>
  </div>

  <!-- 2. Notice banner -->
  <div class="notice" role="note">
    <div class="wrap">
      <div class="lines">
        <span class="bone" style="width:92%"></span>
        <span class="bone" style="width:60%"></span>
      </div>
      <span class="bone pill" style="width:90px;height:34px;flex:none" aria-label="Dismiss"></span>
    </div>
  </div>

  <!-- 3. Main navigation (6 items) -->
  <nav class="mainnav" aria-label="Main">
    <div class="wrap">
      <ul>
        <li><span class="bone" style="width:48px"></span></li>
        <li class="active"><span class="bone" style="width:210px"></span></li>
        <li><span class="bone" style="width:180px"></span></li>
        <li><span class="bone" style="width:140px"></span></li>
        <li><span class="bone" style="width:110px"></span></li>
        <li><span class="bone" style="width:150px"></span></li>
      </ul>
    </div>
  </nav>

  <main id="main" class="wrap">
    <!-- 4. Breadcrumb + page title -->
    <nav class="crumbs" aria-label="Breadcrumb">
      <span class="bone" style="width:44px"></span>
      <span aria-hidden="true" style="color:var(--muted)">&rsaquo;</span>
      <span class="bone" style="width:220px"></span>
    </nav>
    <div class="page-head">
      <span class="bone" style="width:min(520px,90%);height:34px" role="heading" aria-level="1" aria-label="Page title"></span>
      <span class="bone" style="width:min(320px,70%)"></span>
    </div>

    <!-- 5. Tabs -->
    <div class="tabs" role="tablist">
      <span class="active" role="tab" aria-selected="true"><span class="bone" style="width:140px"></span></span>
    </div>

    <!-- 6. Step-by-step guide -->
    <section aria-label="Step-by-step guide">
      <div class="section-head">
        <span class="bone" style="width:260px;height:24px"></span>
        <span class="bone" style="width:220px"></span>
      </div>
      <ol class="steps" id="steps"></ol>
    </section>

    <!-- 7. Call-to-action cards -->
    <section class="cards" aria-label="Quick actions">
      <div class="card">
        <span class="bone" style="width:70%;height:22px"></span>
        <span class="bone" style="width:85%"></span>
        <span class="bone btn"></span>
      </div>
      <div class="card">
        <span class="bone" style="width:75%;height:22px"></span>
        <span class="bone" style="width:80%"></span>
        <span class="bone btn"></span>
      </div>
      <div class="card">
        <span class="bone" style="width:55%;height:22px"></span>
        <span class="bone" style="width:78%"></span>
        <span class="bone btn"></span>
      </div>
    </section>
  </main>

  <!-- 8. Footer: 8 links + copyright -->
  <footer>
    <div class="wrap">
      <div class="footer-links">
        <span class="bone" style="width:110px"></span>
        <span class="bone" style="width:80px"></span>
        <span class="bone" style="width:95px"></span>
        <span class="bone" style="width:75px"></span>
        <span class="bone" style="width:130px"></span>
        <span class="bone" style="width:95px"></span>
        <span class="bone" style="width:100px"></span>
        <span class="bone" style="width:140px"></span>
      </div>
      <div class="footer-meta">
        <span class="bone" style="width:min(420px,90%)"></span>
        <span class="bone" style="width:min(360px,80%)"></span>
      </div>
    </div>
  </footer>

  <!-- 9. Cookie consent banner -->
  <div class="cookie" id="cookie" role="dialog" aria-label="Cookie consent">
    <div class="lines">
      <span class="bone" style="width:95%"></span>
      <span class="bone" style="width:70%"></span>
    </div>
    <div class="btns">
      <button class="bone pill" style="width:110px;height:36px;border:0;cursor:pointer" aria-label="Close banner" onclick="document.getElementById('cookie').hidden=true"></button>
      <span class="bone pill" style="width:110px;height:36px"></span>
    </div>
  </div>

  <script>
    // Six collapsible steps; each has a title, subtitle and placeholder body.
    const steps = document.getElementById('steps');
    const widths = [[220, 300], [160, 260], [200, 320], [230, 220], [200, 340], [280, 380]];
    widths.forEach(([t, s], i) => {
      const li = document.createElement('li');
      li.className = 'step';
      li.setAttribute('open-state', i === 0 ? 'true' : 'false');
      li.innerHTML = `
        <button type="button" aria-expanded="${i === 0}">
          <span class="step-num">${i + 1}</span>
          <span class="step-titles">
            <span class="bone" style="width:min(${t}px,80%);height:18px"></span>
            <span class="bone" style="width:min(${s}px,95%)"></span>
          </span>
          <span class="chev" aria-hidden="true">&#9662;</span>
        </button>
        <div class="step-body">
          <span class="bone" style="width:96%"></span>
          <span class="bone" style="width:88%"></span>
          <span class="bone" style="width:92%"></span>
          <span class="bone" style="width:54%"></span>
        </div>`;
      li.querySelector('button').addEventListener('click', e => {
        const open = li.getAttribute('open-state') !== 'true';
        li.setAttribute('open-state', open);
        e.currentTarget.setAttribute('aria-expanded', open);
      });
      steps.appendChild(li);
    });
  </script>
</body>
</html>
